<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Natan Sousa — Audiovisual & Video Editing</title>
<meta name="description" content="Natan Sousa é profissional de audiovisual e edição de vídeos. Conteúdo para marcas, empresas, mercado imobiliário e redes sociais.">
<meta property="og:type" content="website">
<meta property="og:title" content="Natan Sousa — Audiovisual & Video Editing">
<meta property="og:description" content="Imagens que comunicam. Histórias que permanecem.">
<meta property="og:locale" content="pt_BR">
<meta name="theme-color" content="#080808">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23080808'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' font-style='italic' fill='%23F5F5F2' text-anchor='middle'%3ENS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--bg2:#111111;--bg3:#1B1B1B;--fg:#F5F5F2;--mut:#A3A39E;--line:rgba(245,245,242,.14);
--sans:'Manrope','Helvetica Neue',Arial,sans-serif;--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
--pad:clamp(20px,4vw,64px);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:4px}
.wrap{padding-inline:var(--pad);max-width:1680px;margin-inline:auto}
section{padding-block:clamp(88px,14vw,200px)}
.lbl{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}
h2{font-family:var(--serif);font-weight:300;font-size:clamp(2.4rem,6vw,5.5rem);line-height:1;margin:0 0 clamp(40px,6vw,88px);letter-spacing:-.01em}
/* nav */
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:20px var(--pad);mix-blend-mode:difference}
nav b{font-weight:800;letter-spacing:.14em;font-size:.8rem}
nav ul{display:flex;gap:clamp(18px,3vw,44px);list-style:none;margin:0;padding:0}
nav a{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .35s;padding-bottom:3px}
nav a:hover{background-size:100% 1px}
@media(max-width:700px){nav li:not(:last-child){display:none}}
/* hero */
#hero{min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding-block:0 clamp(28px,5vw,56px);position:relative;background:radial-gradient(120% 80% at 80% 10%,#161616 0%,var(--bg) 60%)}
.mark{position:absolute;width:28px;height:28px;border:0 solid var(--line)}
.m1{top:96px;left:var(--pad);border-width:1px 0 0 1px}.m2{top:96px;right:var(--pad);border-width:1px 1px 0 0}
.tc{position:absolute;top:104px;right:calc(var(--pad) + 44px);font-variant-numeric:tabular-nums;font-size:.72rem;letter-spacing:.2em;color:var(--mut)}
.tc i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#c33;margin-right:10px;vertical-align:1px}
h1{margin:0;font-weight:800;font-size:clamp(3.4rem,15.5vw,15rem);line-height:.84;letter-spacing:-.05em;text-transform:uppercase}
h1 span{display:block;overflow:hidden;padding-bottom:.04em}
h1 em{display:block;font-style:normal;transform:translateY(105%);animation:up 1.3s cubic-bezier(.16,1,.3,1) forwards}
h1 span:nth-child(2) em{animation-delay:.12s;padding-left:clamp(0px,9vw,160px)}
@keyframes up{to{transform:none}}
.hero-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-top:clamp(28px,5vw,64px);flex-wrap:wrap;opacity:0;animation:fade 1.2s .9s forwards}
@keyframes fade{to{opacity:1}}
.hero-foot p{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(1.4rem,2.6vw,2.4rem);line-height:1.15;margin:0;max-width:20ch}
.hero-foot .lbl{text-align:right}
.hero-foot a{display:inline-block;margin-top:10px;border-bottom:1px solid var(--fg);padding-bottom:4px;color:var(--fg)}
/* works */
#works{background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(40px,6vw,96px) clamp(16px,2.5vw,40px);align-items:start}
.w{grid-column:span 8;cursor:pointer;background:none;border:0;padding:0;color:inherit;text-align:left;font:inherit;display:block}
.w.v{grid-column:span 4}
.w:not(.v):last-child:nth-child(odd){grid-column:3/span 8}
.cov{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--bg3),var(--bg2));overflow:hidden;background-size:cover;background-position:center}
.w.v .cov{aspect-ratio:9/16}
.cov b{position:absolute;left:5%;bottom:-6%;font-family:var(--serif);font-weight:300;font-size:clamp(6rem,16vw,15rem);line-height:1;color:rgba(245,245,242,.06)}
.play{position:absolute;right:20px;bottom:20px;width:64px;height:64px;border-radius:50%;border:1px solid var(--fg);display:grid;place-items:center;transition:background .3s,transform .4s}
.play::after{content:"";border-left:14px solid var(--fg);border-block:8px solid transparent;margin-left:4px;transition:border-color .3s}
.w:hover .play{background:var(--fg);transform:scale(1.08)}.w:hover .play::after{border-left-color:var(--bg)}
.soon{position:absolute;left:20px;top:18px}
.meta{display:flex;justify-content:space-between;gap:20px;margin-top:20px;align-items:baseline}
.meta h3{margin:0;font-family:var(--serif);font-weight:300;font-size:clamp(1.5rem,2.4vw,2.2rem);line-height:1.1}
.meta p{margin:8px 0 0;color:var(--mut);font-size:.9rem;max-width:46ch}
@media(max-width:800px){.w,.w.v,.w:last-child:nth-child(odd){grid-column:1/-1}.w.v{max-width:72%}}
/* about */
#about{background:var(--bg2)}
.ab{display:grid;grid-template-columns:5fr 7fr;gap:clamp(32px,6vw,120px);align-items:start}
.ab img{width:100%;aspect-ratio:4/5;object-fit:cover;filter:grayscale(1) contrast(1.05)}
.ab.np{grid-template-columns:1fr}
.ab .q{font-family:var(--serif);font-weight:300;font-size:clamp(1.9rem,4vw,3.6rem);line-height:1.1;margin:0 0 40px;max-width:20ch}
.ab p{max-width:58ch;color:#d4d4cf;margin:0 0 1.2em;font-size:1.05rem}
@media(max-width:800px){.ab{grid-template-columns:1fr}}
/* services */
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:80px 1fr 1.2fr;gap:24px;padding:clamp(28px,4vw,52px) 0;border-bottom:1px solid var(--line);align-items:baseline;transition:padding-left .4s}
.row:hover{padding-left:14px}
.row .n{font-family:var(--serif);font-size:1.3rem;color:var(--mut)}
.row h3{margin:0;font-weight:600;letter-spacing:.14em;font-size:.95rem}
.row p{margin:0;color:var(--mut);max-width:52ch}
@media(max-width:800px){.row{grid-template-columns:44px 1fr}.row p{grid-column:2}}
/* process */
#process{background:var(--bg2)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.st{padding:28px 24px 0 0;border-top:1px solid var(--line);position:relative}
.st::before{content:"";position:absolute;top:-4px;left:0;width:7px;height:7px;border-radius:50%;background:var(--fg)}
.st span{font-family:var(--serif);color:var(--mut);font-size:1.2rem}
.st h3{margin:18px 0 10px;font-weight:600;letter-spacing:.14em;font-size:.85rem}
.st p{margin:0;color:var(--mut);font-size:.95rem}
@media(max-width:800px){.steps{grid-template-columns:1fr;gap:36px}}
/* contact */
#contact h2{font-family:var(--sans);font-weight:800;text-transform:uppercase;font-size:clamp(2.6rem,9.5vw,9.5rem);line-height:.9;letter-spacing:-.045em;max-width:12ch}
.sub{font-family:var(--serif);font-style:italic;font-size:clamp(1.4rem,2.6vw,2.2rem);margin:0 0 56px;color:#d4d4cf}
.cl{display:flex;flex-wrap:wrap;gap:14px}
.cl a{border:1px solid var(--fg);padding:16px 30px;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;transition:background .3s,color .3s}
.cl a:hover,.cl a.pri{background:var(--fg);color:var(--bg)}
.cl a.pri:hover{background:transparent;color:var(--fg)}
footer{border-top:1px solid var(--line);padding:28px var(--pad);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--mut);font-size:.78rem;letter-spacing:.1em}
/* modal */
#md{position:fixed;inset:0;z-index:60;background:rgba(8,8,8,.96);display:none;align-items:center;justify-content:center;padding:var(--pad)}
#md.on{display:flex;animation:fade .35s forwards;opacity:0}
.box{width:min(100%,1200px);max-height:100%}
.box h4{font-family:var(--serif);font-weight:300;font-size:1.6rem;margin:0 0 14px}
.fr{aspect-ratio:16/9;background:#000;display:grid;place-items:center;text-align:center}
.fr.v{aspect-ratio:9/16;max-height:78svh;margin-inline:auto}
.fr iframe{width:100%;height:100%;border:0}
.fr a{border-bottom:1px solid var(--fg);padding-bottom:3px}
#x{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));right:var(--pad);background:none;border:0;color:var(--fg);font:inherit;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;padding:8px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<nav aria-label="Principal"><b>NATAN SOUSA</b>
<ul><li><a href="#works">Trabalhos</a></li><li><a href="#about">Sobre</a></li><li><a href="#services">Serviços</a></li><li><a href="#process">Processo</a></li><li><a href="#contact">Contato</a></li></ul></nav>

<header id="hero">
<i class="mark m1"></i><i class="mark m2"></i>
<div class="tc" aria-hidden="true"><i></i><span id="tc">00:00:00:00</span></div>
<div class="wrap" style="width:100%">
<h1 aria-label="Natan Sousa"><span><em>Natan</em></span><span><em>Sousa</em></span></h1>
<div class="hero-foot">
<p id="tag"></p>
<div class="lbl">Audiovisual &amp; Video Editing<br><a href="#works">Ver trabalhos</a></div>
</div></div>
</header>

<main>
<section id="works"><div class="wrap">
<h2>Selected works</h2>
<div class="grid" id="grid"></div>
</div></section>

<section id="about"><div class="wrap"><div class="ab" id="ab"></div></div></section>

<section id="services"><div class="wrap">
<h2>Serviços</h2>
<div class="list" id="svc"></div>
</div></section>

<section id="process"><div class="wrap">
<h2>Como trabalho</h2>
<div class="steps" id="stp"></div>
</div></section>

<section id="contact"><div class="wrap">
<h2>Let’s create something meaningful.</h2>
<p class="sub">Tem um projeto em mente? Vamos conversar.</p>
<div class="cl" id="cl"></div>
</div></section>
</main>
<footer><span id="ft"></span><span>natansousa.com.br</span></footer>

<div id="md" role="dialog" aria-modal="true" aria-label="Reproduzir projeto"><button id="x">Fechar</button><div class="box" id="box"></div></div>

<script>
/* ============================================================
   CONFIGURAÇÃO CENTRAL — edite só este bloco.
   Para adicionar um vídeo: copie um objeto em "projects" e troque os dados.
   url aceita Instagram (reel), YouTube, Vimeo ou Google Drive (compartilhado como "qualquer pessoa com o link").
   orientation: "16:9" (horizontal) ou "9:16" (vertical).
   Contatos vazios ("") ficam ocultos no site.
   ============================================================ */
const PORTFOLIO = {
  name: "Natan Sousa",
  tagline: "Imagens que comunicam. Histórias que permanecem.",
  playInModal: false, // false = clicar abre o vídeo em nova aba (funciona em qualquer lugar); true = toca dentro do site (use ao publicar no seu domínio)
  contact: {
    whatsapp: "",   // só números com DDI+DDD, ex.: 5521999999999
    email: "",      // ex.: contato@natansousa.com.br
    instagram: "",  // ex.: https://instagram.com/seuusuario
    linkedin: ""    // opcional
  },
  photo: "",        // opcional: imagem em data URI ou URL permitida
  about: [
    "Sou Natan Sousa, profissional de audiovisual e edição de vídeos.",
    "Desenvolvo conteúdos para marcas, empresas e profissionais que querem comunicar suas ideias de forma mais visual, estratégica e envolvente.",
    "Acredito que um bom vídeo vai além de imagens bonitas: ele precisa transmitir uma mensagem, despertar interesse e criar conexão com quem assiste."
  ],
  projects: [
    { title: "Projeto 01", category: "Categoria", description: "", url: "https://www.instagram.com/reel/Ddw3P8Due3h/?mdxt=MWRybGR0MHlmeDJ2Zw==", orientation: "9:16", cover: "" },
    { title: "Projeto 02", category: "Categoria", description: "", url: "https://www.instagram.com/reel/DfLPCqcOPQr/?mdxt=MTRwZ3F0Z2toYjI2cQ==", orientation: "9:16", cover: "" },
    { title: "Projeto 03", category: "Categoria", description: "", url: "https://youtube.com/shorts/ppDocRGfsOo?si=VHpQPYMDq7WEd_Gv", orientation: "9:16", cover: "" },
    { title: "Projeto 04", category: "Categoria", description: "", url: "", orientation: "16:9", cover: "" },
    { title: "Projeto 05", category: "Categoria", description: "", url: "", orientation: "9:16", cover: "" }
  ],
  services: [
    ["Video Editing","Edição profissional, construção narrativa, ritmo, cortes, trilha sonora, tratamento visual e finalização."],
    ["Brand Content","Conteúdos audiovisuais para marcas e empresas."],
    ["Social Media Content","Vídeos estratégicos para Instagram, TikTok, YouTube e outras plataformas."],
    ["Real Estate Films","Produção e edição de vídeos imobiliários e apresentação de imóveis."]
  ],
  process: [
    ["Discovery","Entendimento da marca, do objetivo e da mensagem."],
    ["Creative Direction","Definição da abordagem visual e narrativa."],
    ["Production & Editing","Desenvolvimento e edição do conteúdo audiovisual."],
    ["Final Delivery","Finalização e entrega dos materiais."]
  ]
};
/* ============================================================ */
const P = PORTFOLIO, $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');

$('tag').textContent = P.tagline;
$('ft').textContent = '© ' + new Date().getFullYear() + ' ' + P.name;

// projetos
$('grid').innerHTML = P.projects.map((p, i) => {
  const v = p.orientation === '9:16';
  const cover = p.cover ? ` style="background-image:url('${esc(p.cover)}')"` : '';
  return `<button class="w${v ? ' v' : ''}" data-i="${i}" aria-label="Assistir ${esc(p.title)}">
    <div class="cov"${cover}><b>${pad(i + 1)}</b>${p.url ? '' : '<span class="lbl soon">Em breve</span>'}<span class="play"></span></div>
    <div class="meta"><div><h3>${esc(p.title)}</h3>${p.description ? `<p>${esc(p.description)}</p>` : ''}</div><span class="lbl">${esc(p.category)}</span></div></button>`;
}).join('');

// sobre
$('ab').className = 'ab' + (P.photo ? '' : ' np');
$('ab').innerHTML = (P.photo ? `<img src="${esc(P.photo)}" alt="Retrato de ${esc(P.name)}" loading="lazy">` : '') +
  `<div><p class="q">${esc(P.about[0])}</p>${P.about.slice(1).map(t => `<p>${esc(t)}</p>`).join('')}</div>`;

// serviços e processo
$('svc').innerHTML = P.services.map((s, i) => `<div class="row"><span class="n">${pad(i + 1)}</span><h3>${esc(s[0]).toUpperCase()}</h3><p>${esc(s[1])}</p></div>`).join('');
$('stp').innerHTML = P.process.map((s, i) => `<div class="st"><span>${pad(i + 1)}</span><h3>${esc(s[0]).toUpperCase()}</h3><p>${esc(s[1])}</p></div>`).join('');

// contato
const c = P.contact, links = [];
if (c.whatsapp) links.push(`<a class="pri" href="https://wa.me/${esc(c.whatsapp.replace(/\D/g, ''))}?text=${encodeURIComponent('Olá, Natan! Vim pelo seu portfólio e gostaria de conversar sobre um projeto.')}" target="_blank" rel="noopener">WhatsApp</a>`);
if (c.email) links.push(`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`);
if (c.instagram) links.push(`<a href="${esc(c.instagram)}" target="_blank" rel="noopener">Instagram</a>`);
if (c.linkedin) links.push(`<a href="${esc(c.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`);
$('cl').innerHTML = links.join('') || '<span class="lbl">Contatos em breve</span>';

// vídeo em modal (iframe só é criado ao abrir = lazy)
function embed(u) {
  let m;
  if ((m = u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/))) return 'https://www.youtube-nocookie.com/embed/' + m[1] + '?autoplay=1&rel=0';
  if ((m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return 'https://player.vimeo.com/video/' + m[1] + '?autoplay=1';
  if ((m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
  if ((m = u.match(/instagram\.com\/(?:reel|reels|p|tv)\/([\w-]+)/))) return 'https://www.instagram.com/reel/' + m[1] + '/embed';
  return null;
}
let last = null;
function openM(i) {
  const p = P.projects[i]; last = document.activeElement;
  const src = p.url && embed(p.url), v = p.orientation === '9:16';
  $('box').innerHTML = `<h4>${esc(p.title)}</h4><div class="fr${v ? ' v' : ''}">` +
    (src ? `<iframe src="${esc(src)}" title="${esc(p.title)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`
         : p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">Assistir em nova aba</a>`
         : `<span class="lbl">Vídeo em breve</span>`) + `</div>` +
    (src ? `<p style="text-align:center;margin:14px 0 0"><a class="lbl" href="${esc(p.url)}" target="_blank" rel="noopener">Se o vídeo não carregar, abra em nova aba</a></p>` : '');
  $('md').classList.add('on'); document.body.style.overflow = 'hidden'; $('x').focus();
}
function closeM() { $('md').classList.remove('on'); $('box').innerHTML = ''; document.body.style.overflow = ''; if (last) last.focus(); }
$('grid').addEventListener('click', e => { const b = e.target.closest('.w'); if (!b) return; const i = +b.dataset.i, p = P.projects[i]; if (p.url && !P.playInModal) window.open(p.url, '_blank', 'noopener'); else openM(i); });
$('x').onclick = closeM;
$('md').addEventListener('click', e => { if (e.target === $('md')) closeM(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('md').classList.contains('on')) closeM(); });

// timecode do hero (decorativo; parado se o usuário reduz movimento)
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const t0 = performance.now(), el = $('tc');
  setInterval(() => {
    const f = Math.floor((performance.now() - t0) / 40), s = Math.floor(f / 25);
    el.textContent = `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}:${pad(f % 25)}`;
  }, 80);
}
</script>
</body>
</html>
